; mesh-dualboot selector — runs in the factory partition.
; Boots a chosen OTA slot (MeshCore @ ota_0, Meshtastic @ ota_1) via
; esp_ota_set_boot_partition() + esp_restart().

[platformio]
default_envs = heltec_v4
boards_dir = ../boards

[env]
framework = arduino
monitor_speed = 115200
extra_scripts = pre:slots_build.py

[env:heltec_v4]
platform = espressif32@6.11.0
board = heltec_v4
board_build.partitions = ../partitions.csv
; Force HWCDC (USB-Serial-JTAG) instead of TinyUSB CDC. The board JSON sets
; ARDUINO_USB_MODE=0 (OTG/TinyUSB), which drags in the entire TinyUSB device
; stack — CDC, MSC, HID, MIDI, VIDEO, DFU — for ~70 KB of dead code in a
; selector that only uses Serial for diagnostics.
build_unflags = -DARDUINO_USB_MODE=0
build_flags =
  -DARDUINO_USB_MODE=1
  -D MDB_BOARD_HELTEC_V4=1
  -D MDB_DISPLAY_KIND=0
  -D MDB_PIN_VEXT_EN=36
  -D MDB_PIN_VEXT_ACTIVE=LOW
  -D MDB_PIN_SDA=17
  -D MDB_PIN_SCL=18
  -D MDB_PIN_OLED_RESET=21
  -D MDB_PIN_BUTTON=0
  -D MDB_PIN_LED=35
  -D MDB_PIN_ADC_CTRL=37
  -D MDB_PIN_LORA_PA_POWER=7
  -D MDB_PIN_LORA_LNA_DETECT=2
  -D MDB_OLED_ADDR=0x3C
  -D MDB_AUTO_BOOT_MS=5000
build_src_filter = +<*> -<net_ota/>

[env:t_beam_supreme]
platform = espressif32@6.11.0
board = t_beams3_supreme
board_build.partitions = ../partitions_8MB.csv
build_flags =
  -D MDB_BOARD_T_BEAM_SUPREME=1
  -D MDB_DISPLAY_KIND=1
  -D MDB_PIN_SDA=17
  -D MDB_PIN_SCL=18
  -D MDB_PIN_OLED_RESET=-1
  -D MDB_PIN_BUTTON=0
  -D MDB_PIN_LED=6
  -D MDB_OLED_ADDR=0x3C
  -D MDB_AUTO_BOOT_MS=5000
  -D MDB_HAS_AXP2101=1
  -D MDB_PIN_PMU_SDA=42
  -D MDB_PIN_PMU_SCL=41
  -D XPOWERS_CHIP_AXP2101=1
build_src_filter = +<*> -<net_ota/>
lib_deps =
  lewisxhe/XPowersLib@^0.2.7

; Net-OTA variant of t_beam_supreme. Tighter than heltec_v4_netota:
; only 64 KB tail slack on 8 MB, so factory grows to 768 KB (vs 1 MB on
; 16 MB) and OTA slots + filesystems are trimmed. Fits with ~46 KB
; headroom in factory; OTA slot ceiling drops to 3.125 MB but current
; Meshtastic builds are well under that.
;
; Same compile-time feature flags as heltec_v4_netota.
[env:t_beam_supreme_netota]
extends = env:t_beam_supreme
board_build.partitions = ../partitions_8MB_netota.csv
build_flags =
  ${env:t_beam_supreme.build_flags}
  -D MDB_NET_OTA=1
  -D MDB_NET_OTA_AP=1
  -D MDB_NET_OTA_STA=1
  -D MDB_NET_OTA_HEADLESS=1
  -D MDB_NET_OTA_AUTH_HMAC=1
  ; To enable Ed25519 signed bins on T-Beam: uncomment and set the pubkey
  ; (same instructions as heltec_v4_netota above).
  ; -D MDB_NET_OTA_AUTH_ED25519=1
  ; -D MDB_NET_OTA_PUBKEY_HEX="\"<your-32-byte-pubkey-as-64-hex-chars>\""
build_src_filter = +<*> +<net_ota/>

; Net-OTA variant of heltec_v4. Selector grows to ~900 KB-1 MB by linking
; in WiFi+lwIP, an authenticated TCP listener, and a streamed OTA writer
; that targets ota_0/ota_1 without touching otadata. Uses partitions_netota.csv
; (factory grown to 1 MB; offsets after factory shifted by 0xA0000).
;
; Compile-time feature flags:
;   MDB_NET_OTA               — master enable (gates partition + source filter)
;   MDB_NET_OTA_AP            — include softAP transport (proximate / OLED PSK)
;   MDB_NET_OTA_STA           — include station transport (joins WiFi from NVS)
;   MDB_NET_OTA_HEADLESS      — include NVS-flag trigger (firmware-initiated)
;   MDB_NET_OTA_AUTH_HMAC     — accept HMAC-SHA256-authenticated bins
;   MDB_NET_OTA_AUTH_ED25519  — accept Ed25519-signed bins (requires pubkey)
;   MDB_NET_OTA_PUBKEY_HEX    — 64-char hex literal of the Ed25519 public key
;                                that signed release artifacts (Ed25519 only)
;
; Ed25519 verify uses the orlp/ed25519 library (Zlib license) included as
; a git submodule at selector/lib/ed25519. Run `git submodule update --init
; --recursive` after clone. PlatformIO compiles all .c files in lib/ed25519/
; src/ automatically; test.c at the lib root is ignored.
;
; Invariants enforced via #error in mdb_net_ota.h:
;   - At least one of _AP / _STA must be defined.
;   - At least one of _AUTH_HMAC / _AUTH_ED25519 must be defined.
;   - _AUTH_ED25519 requires _PUBKEY_HEX.
[env:heltec_v4_netota]
extends = env:heltec_v4
board_build.partitions = ../partitions_netota.csv
build_flags =
  ${env:heltec_v4.build_flags}
  -D MDB_NET_OTA=1
  -D MDB_NET_OTA_AP=1
  -D MDB_NET_OTA_STA=1
  -D MDB_NET_OTA_HEADLESS=1
  -D MDB_NET_OTA_AUTH_HMAC=1
  ; To enable Ed25519 signed bins: generate a keypair offline, set the
  ; 64-char hex pubkey here. Do NOT use a placeholder — an all-zeros key
  ; pairs with a known weak private key that anyone can sign with.
  ; -D MDB_NET_OTA_AUTH_ED25519=1
  ; -D MDB_NET_OTA_PUBKEY_HEX="\"<your-32-byte-pubkey-as-64-hex-chars>\""
build_src_filter = +<*> +<net_ota/>
