; mesh-dualboot selector — runs in the factory partition.
; Boots a chosen OTA slot (MeshCore @ ota_0, Meshtastic @ ota_1) via
; esp_ota_set_boot_partition() + esp_restart().

[platformio]
default_envs = heltec_v4
boards_dir = ../boards

[env]
framework = arduino
monitor_speed = 115200
extra_scripts = pre:slots_build.py

[env:heltec_v4]
platform = espressif32@6.11.0
board = heltec_v4
board_build.partitions = ../partitions.csv
; Force HWCDC (USB-Serial-JTAG) instead of TinyUSB CDC. The board JSON sets
; ARDUINO_USB_MODE=0 (OTG/TinyUSB), which drags in the entire TinyUSB device
; stack — CDC, MSC, HID, MIDI, VIDEO, DFU — for ~70 KB of dead code in a
; selector that only uses Serial for diagnostics.
build_unflags = -DARDUINO_USB_MODE=0
build_flags =
  -DARDUINO_USB_MODE=1
  -D MDB_BOARD_HELTEC_V4=1
  -D MDB_DISPLAY_KIND=0
  -D MDB_PIN_VEXT_EN=36
  -D MDB_PIN_VEXT_ACTIVE=LOW
  -D MDB_PIN_SDA=17
  -D MDB_PIN_SCL=18
  -D MDB_PIN_OLED_RESET=21
  -D MDB_PIN_BUTTON=0
  -D MDB_PIN_LED=35
  -D MDB_PIN_ADC_CTRL=37
  -D MDB_PIN_LORA_PA_POWER=7
  -D MDB_PIN_LORA_LNA_DETECT=2
  -D MDB_OLED_ADDR=0x3C
  -D MDB_AUTO_BOOT_MS=5000

[env:t_beam_supreme]
platform = espressif32@6.11.0
board = t_beams3_supreme
board_build.partitions = ../partitions_8MB.csv
build_flags =
  -D MDB_BOARD_T_BEAM_SUPREME=1
  -D MDB_DISPLAY_KIND=1
  -D MDB_PIN_SDA=17
  -D MDB_PIN_SCL=18
  -D MDB_PIN_OLED_RESET=-1
  -D MDB_PIN_BUTTON=0
  -D MDB_PIN_LED=6
  -D MDB_OLED_ADDR=0x3C
  -D MDB_AUTO_BOOT_MS=5000
  -D MDB_HAS_AXP2101=1
  -D MDB_PIN_PMU_SDA=42
  -D MDB_PIN_PMU_SCL=41
  -D XPOWERS_CHIP_AXP2101=1
lib_deps =
  lewisxhe/XPowersLib@^0.2.7
